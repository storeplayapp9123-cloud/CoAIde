name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Keystore aur Key ka password (min 6 characters)"
        required: true
        type: string
      key_alias:
        description: "Key alias naam"
        required: true
        default: "coaide"
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Keystore and Print Base64
        run: |
          PASS="${{ inputs.keystore_password }}"
          ALIAS="${{ inputs.key_alias }}"

          keytool -genkeypair -v \
            -keystore coaide-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Aamir Alam, OU=CoAIde, O=CoAIde, L=Bettiah, S=Bihar, C=IN"

          echo "=== BASE64 START ==="
          base64 -w 0 coaide-release.jks
          echo ""
          echo "=== BASE64 END ==="

      - name: Clean up keystore file
        if: always()
        run: rm -f coaide-release.jks
