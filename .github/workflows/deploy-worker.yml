name: Deploy CoAIde Worker

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Cloudflare Worker & Sync Secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_CLIENT_TOKEN: ${{ secrets.APP_CLIENT_TOKEN }}
        run: |
          npx --yes wrangler deploy
          printf "%s" "$GROQ_API_KEY" | npx --yes wrangler secret put GROQ_API_KEY
          printf "%s" "$APP_CLIENT_TOKEN" | npx --yes wrangler secret put APP_CLIENT_TOKEN
