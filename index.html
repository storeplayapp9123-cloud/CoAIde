<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoAIde - Vision to Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

  <!-- App Header -->
  <header class="w-full max-w-md my-4 text-center">
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 tracking-wider">
      ⚡ CoAIde
    </h1>
    <p class="text-xs text-slate-400 mt-1">Apna UI Screenshot Dalo, Exact Code Pao</p>
  </header>

  <!-- Main Input Card -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-2xl">
    
    <!-- API Key Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-400 mb-1">GROQ API KEY</label>
      <input type="password" id="apiKey" placeholder="gsk_..." class="w-full px-3 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
    </div>

    <!-- Image Upload Area -->
    <div class="mb-5">
      <label class="block text-xs font-semibold text-slate-400 mb-1">UI SCREENSHOT UPLOAD KAREIN</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
    </div>

    <!-- Action Button -->
    <button onclick="generateCode()" id="generateBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-bold text-sm shadow-lg transition duration-200 active:scale-95">
      Code Generate Karein ✨
    </button>

    <!-- Status Message -->
    <div id="status" class="mt-4 text-center text-xs font-medium text-amber-400 hidden animate-pulse">
      CoAIde image ko read karke exact code bana raha hai...
    </div>
  </div>

  <!-- Code Output Area -->
  <div id="outputContainer" class="w-full max-w-md mt-5 bg-slate-900 border border-slate-800 rounded-2xl p-4 hidden">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-bold text-green-400">Generated Code:</span>
      <button onclick="copyCode()" class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 hover:bg-slate-700 text-slate-300">
        Copy Code
      </button>
    </div>
    <textarea id="codeResult" rows="12" class="w-full p-3 rounded-xl bg-slate-950 text-green-400 font-mono text-xs border border-slate-800 focus:outline-none" readonly></textarea>
  </div>

  <script>
    async function generateCode() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');
      const outputContainer = document.getElementById('outputContainer');
      const codeResult = document.getElementById('codeResult');

      if (!apiKey) return alert("Pehle apni Groq API Key daalein!");
      if (!fileInput.files[0]) return alert("Kripya ek UI screenshot upload karein!");

      status.classList.remove('hidden');
      outputContainer.classList.add('hidden');

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onloadend = async () => {
        const base64Image = reader.result;

        try {
          const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "llama-3.2-90b-vision-preview",
              messages: [
                {
                  role: "user",
                  content: [
                    { type: "text", text: "Convert this UI design screenshot into exact HTML code with Tailwind CSS. Output raw HTML only." },
                    { type: "image_url", image_url: { url: base64Image } }
                  ]
                }
              ]
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);

          codeResult.value = data.choices[0].message.content;
          outputContainer.classList.remove('hidden');
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          status.classList.add('hidden');
        }
      };

      reader.readAsDataURL(file);
    }

    function copyCode() {
      const codeArea = document.getElementById('codeResult');
      codeArea.select();
      document.execCommand('copy');
      alert("CoAIde code copy ho gaya!");
    }
  </script>
</body>
</html>
